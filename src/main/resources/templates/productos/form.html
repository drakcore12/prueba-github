<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulario de producto')}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container main-content narrow">
  <div class="back"><a th:href="@{/productos}">← Volver a productos</a></div>
  <div class="page-title"><div><p class="eyebrow">GESTIÓN DE PRODUCTOS</p><h1 th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}">Producto</h1><p>Completa los datos del producto y elige su categoría.</p></div></div>
  <div class="alert error" th:if="${#lists.isEmpty(categorias)}">Debes crear una categoría antes de guardar productos. <a th:href="@{/categorias/nuevo}">Crear categoría</a></div>
  <form class="form-card" th:action="@{/productos/guardar}" th:object="${producto}" method="post" novalidate>
    <input type="hidden" th:field="*{id}">
    <div class="field"><label for="nombre">Nombre <span class="required">*</span></label><input id="nombre" th:field="*{nombre}" type="text" maxlength="120" required placeholder="Ej. Cuaderno profesional"><small class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small></div>
    <div class="field"><label for="descripcion">Descripción</label><textarea id="descripcion" th:field="*{descripcion}" maxlength="500" rows="3" placeholder="Características del artículo (opcional)"></textarea><small class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small></div>
    <div class="field-grid"><div class="field"><label for="precio">Precio (COP) <span class="required">*</span></label><input id="precio" th:field="*{precio}" type="number" min="0.01" step="0.01" placeholder="12000" required><small class="field-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></small></div>
      <div class="field"><label for="stock">Existencias <span class="required">*</span></label><input id="stock" th:field="*{stock}" type="number" min="0" step="1" placeholder="15" required><small class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></small></div></div>
    <div class="field"><label for="categoriaId">Categoría <span class="required">*</span></label><select id="categoriaId" th:field="*{categoriaId}" required><option value="">Selecciona una categoría</option><option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombre}"></option></select><small class="field-error" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></small></div>
    <div class="form-actions"><a class="btn btn-outline" th:href="@{/productos}">Cancelar</a><button class="btn btn-primary" type="submit" th:disabled="${#lists.isEmpty(categorias)}">Guardar producto</button></div>
  </form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
