<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container main-content">
  <div class="page-title"><div><p class="eyebrow">INVENTARIO / MVC</p><h1>Productos</h1><p>Consulta los productos y sus existencias.</p></div><a class="btn btn-primary" th:href="@{/productos/nuevo}">+ Nuevo producto</a></div>
  <div class="alert success" th:if="${exito}" th:text="${exito}" role="status"></div>
  <div class="panel" th:if="${!#lists.isEmpty(productos)}"><div class="table-scroll"><table>
    <thead><tr><th>Producto</th><th>Categoría</th><th>Precio (COP)</th><th>Stock</th><th class="align-right">Acciones</th></tr></thead>
    <tbody><tr th:each="producto : ${productos}">
      <td><strong th:text="${producto.nombre}"></strong></td>
      <td><span class="pill" th:text="${producto.categoria.nombre}"></span></td>
      <td th:text="'$ ' + ${producto.precio}"></td>
      <td><span th:class="${producto.stock == 0 ? 'stock-out' : 'stock-ok'}" th:text="${producto.stock}"></span></td>
      <td><div class="row-actions"><a th:href="@{/productos/{id}(id=${producto.id})}">Consultar</a><a th:href="@{/productos/{id}/editar(id=${producto.id})}">Editar</a><form th:action="@{/productos/{id}/eliminar(id=${producto.id})}" method="post" onsubmit="return confirm('¿Eliminar este producto?');"><button class="link-danger" type="submit">Eliminar</button></form></div></td>
    </tr></tbody></table></div></div>
  <section class="empty-state" th:if="${#lists.isEmpty(productos)}"><div class="empty-symbol">◇</div><h2>No hay productos registrados</h2><p>Primero crea una categoría y después registra un producto.</p><div class="actions"><a class="btn btn-outline" th:href="@{/categorias/nuevo}">Crear categoría</a><a class="btn btn-primary" th:href="@{/productos/nuevo}">Crear producto</a></div></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
