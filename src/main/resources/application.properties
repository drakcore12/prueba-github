spring.application.name=Ockly
server.port=${PORT:8080}

# XAMPP/MySQL: crear primero las tablas ejecutando database/schema.sql.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ockly_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=never
